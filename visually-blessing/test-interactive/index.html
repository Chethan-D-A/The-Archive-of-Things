<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Test Interactive</title>
<style>
body{
    margin:0;
    height:100vh;
    display:grid;
    place-items:center;
    background:#0b0b0b;
    color:#e8e1d5;
    font-family:monospace;
}
button{
    padding:16px 24px;
    background:none;
    border:1px solid #b79a63;
    color:#b79a63;
    cursor:pointer;
}
</style>
</head>
<body>

<button id="button">TEST INTERACTIVE</button>

<script>
document.getElementById("button").addEventListener("click",()=>{
    document.getElementById("button").textContent="IT WORKS";
});
</script>

</body>
</html>
