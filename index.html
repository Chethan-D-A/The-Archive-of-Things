<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>The Archive of Things</title>

<link
    rel="stylesheet"
    href="./assets/css/tat.css"
>

</head>


<body>

<div class="tat-page">

    <main class="welcome">

        <div class="welcome-frame"></div>


        <div class="welcome-content">

            <h1 class="welcome-name">
                THE ARCHIVE OF THINGS
            </h1>


            <button
                class="welcome-enter"
                id="enterArchive"
            >
                ENTER THE ARCHIVE
            </button>

        </div>


        <div class="welcome-index">
            001 / WELCOME
        </div>

    </main>


    <div
        class="welcome-transition"
        id="transition"
    ></div>

</div>


<script src="./assets/js/archive.js"></script>

<script src="./assets/js/cursor.js"></script>


<script>

const transition =
    document.getElementById("transition");

const enterButton =
    document.getElementById("enterArchive");


/*
    Begin indexing immediately.

    This happens while the visitor
    is still on the Welcome page.
*/

const archiveReady =
    indexArchive();


enterButton.addEventListener(
    "click",
    async () => {

        try {

            await archiveReady;

        } catch (error) {

            console.error(error);

        }


        /*
            Begin the entrance transition.
        */

        transition.classList.add(
            "active"
        );


        /*
            Move to Home after the
            transition has begun.
        */

        setTimeout(
            () => {

                window.location.href =
                    "./home/";

            },
            1250
        );

    }
);

</script>

</body>

</html>
