<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="The Archive of Things — an evolving collection of interactive knowledge."
    >

    <title>The Archive of Things</title>

    <link
        rel="stylesheet"
        href="./assets/css/tat.css"
    >
</head>


<body>

    <main class="welcome">

        <div class="welcome-content">

            <h1 class="welcome-name">
                The Archive of Things
            </h1>

            <button
                class="welcome-enter"
                id="enterArchive"
                type="button"
            >
                Enter
            </button>

        </div>

    </main>


    <div
        class="welcome-transition"
        aria-hidden="true"
    ></div>


    <script src="./assets/js/archive.js"></script>

    <script>

        /*
         * Begin indexing immediately.
         * The visitor does not need to wait on the welcome screen.
         */

        const archiveReady = indexArchive();


        const enterButton =
            document.getElementById("enterArchive");


        enterButton.addEventListener(
            "click",
            async () => {

                enterButton.disabled = true;


                try {

                    await archiveReady;

                } catch (error) {

                    console.error(
                        "Archive indexing failed:",
                        error
                    );

                }


                const transition =
                    document.querySelector(
                        ".welcome-transition"
                    );


                transition.classList.add("active");


                setTimeout(
                    () => {

                        window.location.href =
                            "./home/";

                    },
                    1250
                );

            }
        );

    </script>


    <script src="./assets/js/cursor.js"></script>

</body>

</html>
