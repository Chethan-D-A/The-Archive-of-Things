<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Archive of Things</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    background:#0b0b0b;
    color:#e8e1d5;
    font-family:Georgia,"Times New Roman",serif;
}

body{
    min-height:100vh;
}

main{
    width:min(1100px,calc(100% - 40px));
    margin:0 auto;
    padding:80px 0;
}

header{
    border-bottom:1px solid #302f2b;
    padding-bottom:40px;
    margin-bottom:55px;
}

.eyebrow{
    font-family:monospace;
    font-size:11px;
    letter-spacing:4px;
    color:#b79a63;
    margin-bottom:20px;
}

h1{
    font-size:clamp(42px,7vw,76px);
    font-weight:400;
    line-height:1;
    margin:0 0 22px;
}

.description{
    max-width:650px;
    color:#a9a39a;
    font-size:18px;
    line-height:1.7;
}

.section{
    margin-bottom:55px;
}

.section-label{
    font-family:monospace;
    font-size:10px;
    letter-spacing:3px;
    color:#786344;
    margin-bottom:20px;
    text-transform:uppercase;
}

.collection{
    border-top:1px solid #302f2b;
}

.entry{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:30px;
    padding:28px 0;
    border-bottom:1px solid #302f2b;
    text-decoration:none;
    color:inherit;
    transition:padding-left .2s ease,background .2s ease;
}

.entry:hover{
    padding-left:12px;
}

.entry-title{
    font-size:25px;
    margin-bottom:8px;
}

.entry-description{
    font-family:Arial,Helvetica,sans-serif;
    font-size:13px;
    color:#8d8982;
    line-height:1.5;
}

.entry-type{
    flex-shrink:0;
    font-family:monospace;
    font-size:9px;
    letter-spacing:2px;
    color:#b79a63;
}

.status{
    font-family:monospace;
    font-size:10px;
    letter-spacing:2px;
    color:#786344;
    padding:20px 0;
}

.error{
    color:#8d8982;
}

footer{
    margin-top:80px;
    padding-top:25px;
    border-top:1px solid #302f2b;
    font-family:monospace;
    font-size:9px;
    letter-spacing:2px;
    color:#5f5b55;
}

@media(max-width:600px){

    main{
        width:min(100% - 28px,1100px);
        padding:50px 0;
    }

    .entry{
        align-items:flex-start;
        flex-direction:column;
        gap:15px;
    }

}
</style>
</head>

<body>

<main>

<header>

    <div class="eyebrow">
        THE ARCHIVE OF THINGS
    </div>

    <h1>
        Things to explore,<br>
        experiment with,<br>
        and understand.
    </h1>

    <div class="description">
        A curated collection of interactive things built to make
        ideas tangible. Explore them, manipulate them, and see
        what happens.
    </div>

</header>

<div id="archive">

    <div class="status">
        INDEXING ARCHIVE...
    </div>

</div>

<footer>
    THE ARCHIVE OF THINGS · OPEN COLLECTION
</footer>

</main>

<script>

const OWNER = "Chethan-D-A";
const REPO = "The-Archive-of-Things";
const BRANCH = "main";

const archive = document.getElementById("archive");


/* ================================
   GITHUB API
================================ */

async function getContents(path=""){

    const url =
        `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`;

    const response =
        await fetch(url);

    if(!response.ok){
        throw new Error(
            `GitHub API error: ${response.status}`
        );
    }

    return response.json();

}


/* ================================
   HELPERS
================================ */

function titleCase(text){

    return text
        .replace(/[-_]+/g," ")
        .replace(/\b\w/g,c=>c.toUpperCase());

}


function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ================================
   FIND INTERACTIVES
================================ */

async function findInteractives(category){

    const items =
        await getContents(category);

    const folders =
        items.filter(
            item => item.type === "dir"
        );


    /*
       Inspect every interactive folder
       simultaneously.
    */

    const checks =
        folders.map(async folder => {

            try{

                const contents =
                    await getContents(folder.path);


                const index =
                    contents.find(
                        item =>
                            item.type === "file" &&
                            item.name.toLowerCase() === "index.html"
                    );


                const metadata =
                    contents.find(
                        item =>
                            item.type === "file" &&
                            item.name.toLowerCase() === "archive.json"
                    );


                /*
                   An interactive must contain
                   both index.html and archive.json.
                */

                if(!index || !metadata){
                    return null;
                }


                /*
                   Load the metadata.
                */

                const response =
                    await fetch(metadata.download_url);


                if(!response.ok){
                    return null;
                }


                const data =
                    await response.json();


                return {

                    name:
                        data.title ||
                        titleCase(folder.name),

                    description:
                        data.description ||
                        "Interactive experience",

                    type:
                        data.type ||
                        "interactive",

                    path:
                        folder.path

                };


            }catch(error){

                console.warn(
                    `Could not inspect ${folder.path}`,
                    error
                );

                return null;

            }

        });


    const results =
        await Promise.all(checks);


    return results.filter(Boolean);

}


/* ================================
   LOAD ARCHIVE
================================ */

async function loadArchive(){

    try{

        /*
           Get repository root.
        */

        const root =
            await getContents();


        /*
           Every top-level directory
           becomes a category.
        */

        const categories =
            root.filter(
                item =>
                    item.type === "dir" &&
                    !item.name.startsWith(".")
            );


        /*
           Inspect every category
           simultaneously.
        */

        const categoryResults =
            await Promise.all(

                categories.map(
                    async category => {

                        const interactives =
                            await findInteractives(
                                category.path
                            );


                        return {
                            category,
                            interactives
                        };

                    }
                )

            );


        archive.innerHTML = "";


        let visibleCategories = 0;


        /*
           Render categories.
        */

        for(
            const result of categoryResults
        ){

            const {
                category,
                interactives
            } = result;


            /*
               Hide empty categories.
            */

            if(interactives.length === 0){
                continue;
            }


            visibleCategories++;


            const section =
                document.createElement("section");

            section.className =
                "section";


            const label =
                document.createElement("div");

            label.className =
                "section-label";

            label.textContent =
                titleCase(category.name);


            const collection =
                document.createElement("div");

            collection.className =
                "collection";


            /*
               Render every interactive.
            */

            for(
                const interactive of interactives
            ){

                const link =
                    document.createElement("a");

                link.className =
                    "entry";


                /*
                   Build the relative URL.
                */

                link.href =
                    "./" +
                    interactive.path
                        .split("/")
                        .map(encodeURIComponent)
                        .join("/") +
                    "/";


                link.innerHTML = `

                    <div>

                        <div class="entry-title">
                            ${escapeHTML(
                                interactive.name
                            )}
                        </div>

                        <div class="entry-description">
                            ${escapeHTML(
                                interactive.description
                            )}
                        </div>

                    </div>

                    <div class="entry-type">
                        ${escapeHTML(
                            interactive.type
                        ).toUpperCase()}
                    </div>

                `;


                collection.appendChild(link);

            }


            section.appendChild(label);
            section.appendChild(collection);

            archive.appendChild(section);

        }


        /*
           Nothing found.
        */

        if(visibleCategories === 0){

            archive.innerHTML = `
                <div class="status">
                    NO INTERACTIVES FOUND.
                </div>
            `;

        }


    }catch(error){

        console.error(error);


        archive.innerHTML = `
            <div class="status error">
                ARCHIVE INDEX UNAVAILABLE.
                <br><br>
                The collection could not be loaded from GitHub.
            </div>
        `;

    }

}


/* ================================
   START
================================ */

loadArchive();

</script>

</body>
</html>
